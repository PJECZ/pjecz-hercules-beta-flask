[project]
name = "pjecz-hercules-beta-flask"
version = "0.1.0"
description = "Versión BETA de Hércules donde se ponen a prueba nuevos módulos."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-moment>=1.0.6",
    "flask-socketio>=5.6.1",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "google-auth>=2.58.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.14.1",
    "gunicorn>=26.2.0",
    "hashids>=1.3.1",
    "jinja2>=3.1.6",
    "lxml[html-clean]>=6.1.3",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytz>=2026.3.post1",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.0.54",
    "sqlalchemy-utils>=0.42.1",
    "unidecode>=1.4.0",
    "uvicorn>=0.53.0",
    "werkzeug>=3.1.8",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821", "RUF012"]
line-length = 128

[project]
name = "pjecz-hercules-beta-flask"
version = "4.1.0"
description = "Versión BETA de Hércules donde se ponen a prueba nuevos módulos."
readme = "README.md"
authors = [
    { name = "Guillermo Valdes", email = "guillermo.valdes@pjecz.gob.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-moment>=1.0.6",
    "flask-socketio>=5.7.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "google-auth>=2.62.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-storage>=3.17.1",
    "gunicorn>=26.2.0",
    "hashids>=1.3.1",
    "jinja2>=3.1.6",
    "lxml[html-clean]>=6.1.3",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rq>=3.0.0",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-utils>=0.43.0",
    "typer>=0.27.3",
    "unidecode>=1.4.0",
    "uvicorn>=0.54.0",
    "werkzeug>=3.1.9",
    "xhtml2pdf>=0.2.28",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "ruff>=0.17.3",
]

[project.scripts]
pjecz-hercules-beta-flask = "pjecz_hercules_beta_flask.cli.app:cli"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821", "RUF012"]
line-length = 128
